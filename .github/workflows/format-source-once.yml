name: One-time SLAMS source formatting

on:
  push:
    branches:
      - chore/prettier-source-cleanup-2026-11-07
    paths:
      - .github/workflows/format-source-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/prettier-source-cleanup-2026-11-07
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format source files, without altering application logic
        run: |
          bunx prettier --write 'src/**/*.{ts,tsx}'
          git diff --check
          git diff --stat
      - name: Commit formatter-only diff on the cleanup branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: normalize existing SLAMS TypeScript formatting"
            git push origin HEAD:chore/prettier-source-cleanup-2026-11-07
          fi
