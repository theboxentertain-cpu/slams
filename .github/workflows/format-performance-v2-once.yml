name: One-time Performance Lab V2 formatting

on:
  push:
    branches: [feat/performance-lab-local-takes-v1]
    paths: [.github/workflows/format-performance-v2-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-lab-local-takes-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prettier V2 sources and specs only
        run: |
          bunx prettier --write src/components/foundation/PerformanceLab.tsx src/components/foundation/TakeMarkerEditor.tsx src/lib/performance-review-model.ts src/test/performance-review-model.test.ts src/test/performance-lab-local.test.tsx
          git diff --check
      - name: Commit formatter result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Performance Lab V2 timecoded review"
            git push origin HEAD:feat/performance-lab-local-takes-v1
          fi
