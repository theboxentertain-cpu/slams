name: One-time Stanislavski draft formatting

on:
  push:
    branches: [feat/stanislavski-y1t1-workshop-one]
    paths: [.github/workflows/format-stanislavski-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stanislavski-y1t1-workshop-one
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only Stanislavski draft sources and tests
        run: |
          bunx prettier --write src/data/stanislavski-editorial-workshop-one.ts src/components/foundation/StanislavskiWorkshopOne.tsx src/components/foundation/StanislavskiAcademicPreview.tsx src/components/foundation/SchoolPages.tsx src/test/stanislavski-workshop-content.test.ts src/test/stanislavski-workshop-ui.test.tsx src/data/stanislavski-assessment-draft.ts src/test/stanislavski-assessment-draft.test.ts
          git diff --check
      - name: Commit isolated style changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Stanislavski academic workshop pilot"
            git push origin HEAD:feat/stanislavski-y1t1-workshop-one
          fi
