name: One-time Stuck Passport formatting

on:
  push:
    branches: [feat/stuck-passport-opt-in]
    paths: [.github/workflows/format-stuck-passport-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stuck-passport-opt-in
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prettier only affected changes
        run: |
          bunx prettier --write src/components/foundation/StuckDeskGuide.tsx src/components/foundation/StuckDeskPassportSave.tsx src/test/stuck-desk-guide.test.tsx src/test/architecture-cleanup.test.tsx
          git diff --check
      - name: Commit only formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Stuck Desk Passport opt-in implementation"
            git push origin HEAD:feat/stuck-passport-opt-in
          fi
