name: One-time Performance Lab formatting
on:
  push:
    branches: [feat/performance-lab-local-takes-v1]
    paths: [.github/workflows/format-performance-lab-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-lab-local-takes-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only new Performance Lab source and tests
        run: |
          bunx prettier --write src/components/foundation/PerformanceLab.tsx src/routes/lab.tsx src/lib/foundation.ts src/test/performance-lab-local.test.tsx
          git diff --check
      - name: Commit targeted formatter result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Performance Lab capture and tests"
            git push origin HEAD:feat/performance-lab-local-takes-v1
          fi
