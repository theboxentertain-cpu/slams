name: One-time Performance Lab V2 validation
on:
  push:
    branches: [feat/performance-lab-timecoded-v2]
    paths: [.github/workflows/validate-performance-v2-once.yml]
permissions:
  contents: write
jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'theboxentertain-cpu/slams'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/performance-lab-timecoded-v2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format affected V2 files
        run: |
          bunx prettier --write src/components/foundation/PerformanceLab.tsx src/components/foundation/TakeMarkerEditor.tsx src/lib/performance-review-model.ts src/test/performance-review-model.test.ts src/test/performance-lab-local.test.tsx
          git diff --check
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Performance Lab V2"
            git push origin HEAD:feat/performance-lab-timecoded-v2
          fi
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Semantic lint
        run: bunx eslint . --rule 'prettier/prettier: off'
      - name: Unit and UI tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Full lint and formatting
        run: bun run lint
