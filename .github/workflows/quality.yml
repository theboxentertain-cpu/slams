name: SLAMS quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Lint changed localization paths
        run: >-
          bunx eslint
          src/routes/__root.tsx
          src/components/foundation/AppShell.tsx
          src/components/foundation/SettingsPage.tsx
          src/components/foundation/SectionTabs.tsx
          src/components/office/DirectorsOffice.tsx
          src/components/welcome/WelcomeFrame.tsx
          src/components/welcome/WelcomePages.tsx
          src/test/i18n-activation.test.tsx
      - name: Run unit and UI tests
        run: bun run test
      - name: Compile production build
        run: bun run build
      - name: Report repository-wide legacy lint debt
        run: bun run lint
