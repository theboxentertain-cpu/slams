name: One-time Stuck Desk PR formatting

on:
  push:
    branches: [feat/stuck-desk-guided-rescue-v1]
    paths: [.github/workflows/format-stuck-rescue-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'theboxentertain-cpu/slams'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stuck-desk-guided-rescue-v1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only affected source and tests
        run: |
          bunx prettier --write src/data/stuck-guided.ts src/components/foundation/StuckDeskGuided.tsx src/components/foundation/WorkspacePages.tsx src/test/stuck-guided-content.test.ts src/test/stuck-guided-ui.test.tsx src/test/architecture-cleanup.test.tsx
          git diff --check
      - name: Commit isolated formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u src
            git commit -m "style: format Stuck Desk guided rescue workflow"
            git push origin HEAD:feat/stuck-desk-guided-rescue-v1
          fi
